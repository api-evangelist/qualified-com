domain_standard:
  market: B2B marketing / sales engagement / conversational marketing
  declared_in_contract: false
  evidence: >-
    No domain standard is declared by the contract. The B2B go-to-market market has no widely
    adopted interchange standard of the kind scored here — there is no OpenRTB, SCIM URN,
    OData $metadata, LTI/OneRoster shape, HL7/X12 message type or ActivityPub actor to find,
    and Qualified declares none. Its interoperability is expressed as named CRM/MAP
    integrations (Salesforce, HubSpot, Marketo, Eloqua, Outreach, Salesloft, 6sense,
    Demandbase, Slack) and as Salesforce object identity inside the contract itself — for
    example cancelMeeting is keyed on a Salesforce Event ID rather than a Qualified id, which
    is a de facto vendor coupling rather than a standard. Recorded as absent so the
    reward-only check neither credits nor penalises.
