apis:
- aid: qualified-com-enterprise-api
  name: Qualified Enterprise API
  description: 'The Qualified Enterprise API (v2) connects Qualified data to a warehouse,
    CDP or downstream system. It exposes leads, website sessions, conversations, messages,
    meetings and outbound emails as readable resources, and accepts writes back to
    Qualified for leads and companies individually or through a bulk job. Reads follow
    a pull model over a time window with cursor pagination; writes are scoped by named
    permissions on the API key. Two legacy /v1 reporting endpoints for bot and rep
    conversations remain supported.'
