aid: qualified-com
name: Qualified
description: 'Qualified is a San Francisco based B2B agentic marketing platform built
  around Piper, an AI SDR agent that engages website visitors in real time with chat,
  voice, video, email, meeting booking and personalized offers, and works natively
  alongside Salesforce, HubSpot, Marketo, Eloqua, Outreach, Salesloft, 6sense, Demandbase
  and Slack. The company publishes the Qualified Enterprise API, a versioned REST
  contract at api.qualified.com that exposes the underlying records behind the platform
  — leads, website sessions, conversations, messages, meetings and outbound emails
  — plus write endpoints for leads and companies, a bulk job endpoint and a GDPR
  deletion request endpoint, so customers can pipe engagement data into Snowflake,
  Databricks, BigQuery, Adobe AEP or Eloqua and write enriched records back. The
  API is bearer-token authenticated with named OAuth-style scopes, cursor paginated,
  documented for incremental (delta) sync, and is available on the Enterprise and
  Ultimate plan tiers.'
