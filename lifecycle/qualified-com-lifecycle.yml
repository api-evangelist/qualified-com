      The earlier /v1 Enterprise API endpoints "are still served and remain supported for
      existing integrations, but they are not documented here."
  - operationId: listBotConversations
    path: /v1/bot_conversations
    status: legacy, fully supported
    superseded_by: [listConversations, listMessages, listMeetings]
    note: >-
      Predates the rest of the API. Returns snake_case fields and pages with
      starting_after/limit + a meta block. Not recommended for new integrations.
  - operationId: listRepConversations
    path: /v1/rep_conversations
    status: legacy, fully supported
    superseded_by: [listConversations, listMessages, listMeetings]
